# App-of-Apps root: Argo CD watches gitops/apps/ and manages one child
# Application per workshop component. Replace repoURL with your fork/clone.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.example.com/anycompany/agents-workshop.git
    targetRevision: main
    path: modules/1600-gitops-delivery/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true        # delete resources removed from Git
      selfHeal: true     # revert manual kubectl drift
    syncOptions:
      - CreateNamespace=true
