# Run the eval suite as a Kubernetes Job against the in-cluster agent.
# Used ad-hoc or as a release gate from the GitOps pipeline (module 1600).
# Exit code propagates: a regression makes the Job fail (backoffLimit: 0).
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-eval
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: agent-eval
    spec:
      restartPolicy: Never
      containers:
        - name: agent-eval
          image: ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/agent-eval:v1
          imagePullPolicy: Always
          env:
            - name: AGENT_URL
              value: "http://customer-agent.default.svc.cluster.local:8080/chat"
            - name: JUDGE_MODEL_BASE_URL
              value: "http://ai-gateway.envoy-gateway-system.svc.cluster.local/v1"
            - name: JUDGE_MODEL_ID
              value: "nova-pro"
          command: ["python", "runner.py", "scenarios.yaml"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
